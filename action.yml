name: agent-crashtest refunds
description: >-
  Run an agent against one simulated refund tool over MCP (a test double writing to a
  local PostgreSQL; no real money) under a fault (by default a lost response after the
  refund commits; scenario: all adds a connection cut before the request), and fail the
  build if the agent refunds twice or loses the refund. A custom agent script runs inside the job, with the
  environment the workflow gives it: do not give it secrets or production credentials
  it does not need. The Action passes none.
branding:
  icon: shield
  color: red

inputs:
  agent:
    description: >-
      naive or stable_key (the two example agents), or the path of your own agent
      script, relative to the workspace (see examples/stable_key_agent.py for the contract).
    required: false
    default: stable_key
  scenario:
    description: >-
      refunds (a lost response after the commit, the default),
      refunds-cut-before-request (the connection cut before the request), or all (both,
      one after the other; the result is the worst of the two). Use all: an agent that
      reports "done" after an error without retrying passes refunds alone, and fails the cut.
    required: false
    default: refunds
  trials:
    description: How many fresh orders to run the agent on, per scenario.
    required: false
    default: "5"
  fail-on-duplicate-effect:
    description: >-
      "true" fails the step when the sink holds a duplicate (or lost) refund. With
      "false" the report is still written and the step passes. Environment errors and
      an unconfirmed fault always fail it.
    required: false
    default: "true"

outputs:
  result:
    description: >-
      PASS, FAIL, WARN or INCONCLUSIVE (empty on an environment error); with scenario all,
      the worst of the scenarios' results (FAIL, then INCONCLUSIVE, then WARN, then PASS).
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: >-
      The exit code of crashtest run (0, 1, 2 or 3); with scenario all, the most serious
      (an environment error, then 3, then 1, then 0).
    value: ${{ steps.run.outputs.exit-code }}
  junit-file:
    description: >-
      The JUnit XML report, one test case per trial: crashtest-junit.xml in the workspace
      for refunds (as before), crashtest-junit-<scenario>.xml for the others; with
      scenario all, both paths separated by a space.
    value: ${{ steps.run.outputs.junit-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install agent-crashtest
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "${ACTION_PATH}[local]"

    - name: crashtest run
      id: run
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        TRIALS: ${{ inputs.trials }}
        SCENARIO: ${{ inputs.scenario }}
        FAIL_ON_DUPLICATE: ${{ inputs.fail-on-duplicate-effect }}
      run: |
        case "$SCENARIO" in
          refunds|refunds-cut-before-request) scenarios="$SCENARIO" ;;
          all) scenarios="refunds refunds-cut-before-request" ;;
          *) echo "::error title=agent-crashtest::unknown scenario '${SCENARIO}' (refunds, refunds-cut-before-request or all)"; exit 2 ;;
        esac
        junits=""; codes=""; results=""
        for s in $scenarios; do
          if [ "$s" = refunds ]; then junit="${GITHUB_WORKSPACE}/crashtest-junit.xml"
          else junit="${GITHUB_WORKSPACE}/crashtest-junit-${s}.xml"; fi
          set +e
          crashtest run "$s" --agent "$AGENT" --trials "$TRIALS"             --data-dir "${RUNNER_TEMP}/crashtest-pgdata"             --junit-file "$junit" --markdown-file "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          echo "${s}: exit code ${code}"
          junits="${junits:+$junits }$junit"; codes="$codes $code"
          if [ -f "$junit" ]; then
            results="$results $(python -c 'import sys, xml.etree.ElementTree as E; print(E.parse(sys.argv[1]).getroot().find("properties/property[@name=\"result\"]").get("value"))' "$junit")"
          fi
        done
        # The most serious exit code: an environment error, then 3, then 1, then 0.
        code=0
        for c in $codes; do
          case "$c" in 0|1|3) ;; *) code=$c; break ;; esac
          if [ "$c" = 3 ]; then code=3; elif [ "$c" = 1 ] && [ "$code" = 0 ]; then code=1; fi
        done
        result=""
        for r in FAIL INCONCLUSIVE WARN PASS; do
          case " $results " in *" $r "*) result=$r; break ;; esac
        done
        case "$code" in 0|1|3) ;; *) result="" ;; esac
        echo "junit-file=${junits}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        echo "result=${result}" >> "$GITHUB_OUTPUT"
        case "$code" in
          0) ;;
          1)
            if [ "$FAIL_ON_DUPLICATE" = "true" ]; then
              echo "::error title=agent-crashtest::duplicate or lost refund (see the report above)"
              exit 1
            fi
            echo "::warning title=agent-crashtest::duplicate or lost refund (fail-on-duplicate-effect is off)"
            ;;
          3)
            echo "::error title=agent-crashtest::the fault was not confirmed; the run tested nothing"
            exit 3
            ;;
          *)
            echo "::error title=agent-crashtest::environment or configuration error (exit ${code})"
            exit "$code"
            ;;
        esac
