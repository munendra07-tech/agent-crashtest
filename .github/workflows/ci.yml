name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests examples
      - name: Ruff format
        run: ruff format --check src tests examples
      - name: mypy
        run: mypy

  test-local:
    # Tests start their own stack: pip-installed PostgreSQL plus the services as subprocesses.
    # The full suite on each OS, so platform statements rest on every test, not a smoke run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests with coverage
        # PostgreSQL data and pytest's temporary folders under the runner's temp
        # directory: on the Windows runner, initdb cannot set permissions on a
        # folder inside the checkout.
        env:
          CRASHTEST_PGDATA: ${{ runner.temp }}/pgdata
        run: pytest --basetemp "${{ runner.temp }}/pytest" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml

  test-docker:
    # Same tests against the Docker Compose stack.
    runs-on: ubuntu-latest
    env:
      # A throwaway token for this job's sink (Compose requires one); not a secret.
      CRASHTEST_CONTROL_TOKEN: ci-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start stack
        run: docker compose up --build -d --wait
      - name: Tests against the stack
        env:
          CRASHTEST_SINK_URL: http://localhost:8101
          CRASHTEST_MCP_URL: http://localhost:8102/mcp
          CRASHTEST_MCP_URL_STATELESS_SSE: http://localhost:8103/mcp
          CRASHTEST_MCP_URL_STATEFUL_JSON: http://localhost:8104/mcp
          CRASHTEST_MCP_URL_STATEFUL_SSE: http://localhost:8105/mcp
          CRASHTEST_MCP_URL_STATEFUL_SSE_STORE: http://localhost:8106/mcp
        run: pytest
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  clean-install:
    # A clean runner on each OS: install the package (not editable) into a fresh
    # environment and run selftest and both example agents outside the checkout. The
    # unsafe agent must FAIL (exit 1), the safe one must PASS (exit 0).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from scratch
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then BIN=Scripts; else BIN=bin; fi
          echo "BIN=$RUNNER_TEMP/clean/$BIN" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clean/$BIN/python" -m pip install --no-cache-dir ".[local]"
      - name: Selftest
        working-directory: ${{ runner.temp }}
        run: '"$BIN/crashtest" selftest'
      - name: The naive agent fails
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          "$BIN/crashtest" run refunds --agent naive --trials 3 \
            --format json --output naive.json
          code=$?
          set -e
          test "$code" -eq 1
          "$BIN/python" -c "import json; r = json.load(open('naive.json')); print(r['summary']); assert r['result'] == 'FAIL'"
      - name: The stable-key agent passes
        working-directory: ${{ runner.temp }}
        run: |
          "$BIN/crashtest" run refunds --agent stable_key --trials 3
      - name: stdio without a sink fails clearly
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          "$BIN/crashtest" mcp --stdio --sink-url http://127.0.0.1:9 > stdio.out 2> stdio.err
          code=$?
          set -e
          cat stdio.err
          test "$code" -eq 2
          test ! -s stdio.out
          grep -q "no sink is running" stdio.err
      - name: Same verdicts over stdio and HTTP
        working-directory: ${{ runner.temp }}
        run: '"$BIN/python" "$GITHUB_WORKSPACE/tests/check_transport_parity.py" parity-pgdata'
      - name: Selftest of the cut-before-request scenario
        working-directory: ${{ runner.temp }}
        run: '"$BIN/crashtest" selftest --scenario refunds-cut-before-request'
      - name: The test controller over stdio drives a run
        working-directory: ${{ runner.temp }}
        run: '"$BIN/python" "$GITHUB_WORKSPACE/tests/check_controller.py" controller-pgdata'

  inspector:
    # The MCP Inspector's CLI (docs/clients/mcp-inspector.md) against `crashtest serve`,
    # over Streamable HTTP and stdio, exactly as the guide shows.
    runs-on: ubuntu-latest
    env:
      INSPECTOR: "@modelcontextprotocol/inspector@2.14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ".[local]"
      - name: Start the stack
        working-directory: ${{ runner.temp }}
        run: |
          nohup crashtest serve --data-dir "$RUNNER_TEMP/insp-pgdata" > serve.log 2>&1 &
          for _ in $(seq 120); do [ -f .crashtest-stack.json ] && break; sleep 1; done
          cat serve.log
          echo "MCP_URL=$(python -c "import json; print(json.load(open('.crashtest-stack.json'))['mcp_url'])")" >> "$GITHUB_ENV"
          echo "STACK_FILE=$RUNNER_TEMP/.crashtest-stack.json" >> "$GITHUB_ENV"
      - name: tools/list and tools/call over Streamable HTTP
        working-directory: ${{ runner.temp }}
        run: |
          npx -y "$INSPECTOR" --cli "$MCP_URL" --method tools/list | tee http-list.out
          grep -q issue_refund http-list.out
          npx -y "$INSPECTOR" --cli "$MCP_URL" --method tools/call --tool-name issue_refund --tool-arg order_id=ord-insp-1 --tool-arg amount_cents=2500
          crashtest verdict ord-insp-1
      - name: tools/list and tools/call over stdio
        working-directory: ${{ runner.temp }}
        run: |
          npx -y "$INSPECTOR" --cli crashtest mcp --stdio --stack-file "$STACK_FILE" -- --method tools/list | tee stdio-list.out
          grep -q issue_refund stdio-list.out
          npx -y "$INSPECTOR" --cli crashtest mcp --stdio --stack-file "$STACK_FILE" -- --method tools/call --tool-name issue_refund --tool-arg order_id=ord-insp-2 --tool-arg amount_cents=2500
          crashtest verdict ord-insp-2

  framework-examples:
    # examples/frameworks/: agents built with Pydantic AI and LangGraph, driven by a
    # scripted model (no API key). Each framework gets its own Python; the naive
    # variant must FAIL (a duplicate) and the stable-key one must PASS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: The frameworks' own environments
        run: |
          python -m venv "$RUNNER_TEMP/ex-pydantic-ai"
          "$RUNNER_TEMP/ex-pydantic-ai/bin/python" -m pip install -r examples/frameworks/requirements-pydantic-ai.txt
          python -m venv "$RUNNER_TEMP/ex-langgraph"
          "$RUNNER_TEMP/ex-langgraph/bin/python" -m pip install -r examples/frameworks/requirements-langgraph.txt
      - name: Naive FAIL and stable key PASS, per framework
        env:
          CRASHTEST_EXAMPLE_PYDANTIC_AI_PYTHON: ${{ runner.temp }}/ex-pydantic-ai/bin/python
          CRASHTEST_EXAMPLE_LANGGRAPH_PYTHON: ${{ runner.temp }}/ex-langgraph/bin/python
          CRASHTEST_REQUIRE_EXAMPLES: "1"
        run: pytest tests/test_framework_examples.py -v -rs

  action:
    # The GitHub Action in action.yml, run from this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The Action passes the stable-key agent
        id: safe
        uses: ./
        with:
          agent: stable_key
          trials: "3"
      - name: The Action reports the naive agent's duplicate
        id: unsafe
        uses: ./
        with:
          agent: naive
          trials: "3"
          fail-on-duplicate-effect: "false"
      - name: Check the outputs
        env:
          SAFE: ${{ steps.safe.outputs.result }}
          UNSAFE: ${{ steps.unsafe.outputs.result }}
          UNSAFE_CODE: ${{ steps.unsafe.outputs.exit-code }}
          JUNIT: ${{ steps.unsafe.outputs.junit-file }}
        run: |
          test "$SAFE" = PASS
          test "$UNSAFE" = FAIL
          test "$UNSAFE_CODE" = 1
          grep -q 'type="duplicate"' "$JUNIT"
